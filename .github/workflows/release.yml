name: Deploy task-harbor

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-task-harbor-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/task-harbor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=git-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: task-harbor-prod

    steps:
      - name: Deploy to Tencent Cloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 20m
          command_timeout: 20m
          script: |
            set -euo pipefail

            IMAGE='${{ env.IMAGE_NAME }}:git-${{ github.sha }}'
            APP_DIR="$HOME/workspace/task-harbor"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Git-tagged images are not dangling, so the default prune leaves every deployment behind.
            docker container prune --force >/dev/null
            docker image prune --all --force >/dev/null
            docker network prune --force >/dev/null
            docker builder prune --all --force --filter 'until=168h' >/dev/null 2>&1 || true
            AVAILABLE_KB="$(df -Pk "$APP_DIR" | awk 'NR==2 {print $4}')"
            if [ -z "$AVAILABLE_KB" ] || [ "$AVAILABLE_KB" -lt 1048576 ]; then
              echo "Less than 1 GiB is available for deployment"
              docker system df
              exit 1
            fi

            PORT_FILE="$APP_DIR/.app-port"
            if [ -s "$PORT_FILE" ]; then
              APP_PORT="$(cat "$PORT_FILE")"
            else
              APP_PORT=8080
              while docker ps --format '{{.Ports}}' | grep -Eq ":${APP_PORT}->"; do
                APP_PORT=$((APP_PORT + 1))
              done
              printf '%s\n' "$APP_PORT" > "$PORT_FILE"
            fi
            case "$APP_PORT" in
              ''|*[!0-9]*) echo "Invalid port in $PORT_FILE"; exit 1 ;;
            esac
            export APP_PORT

            APP_ORIGIN='${{ secrets.PERF_APP_ORIGIN }}'
            if [ -z "$APP_ORIGIN" ]; then
              APP_ORIGIN="http://${{ secrets.PERF_VM_HOST }}:${APP_PORT}"
            fi
            export APP_ORIGIN

            ENCRYPTION_KEY_FILE="$APP_DIR/.app-encryption-key"
            if [ ! -s "$ENCRYPTION_KEY_FILE" ]; then
              openssl rand -hex 32 > "$ENCRYPTION_KEY_FILE"
              chmod 600 "$ENCRYPTION_KEY_FILE"
            fi
            export APP_ENCRYPTION_KEY="$(cat "$ENCRYPTION_KEY_FILE")"

            DB_PASSWORD_FILE="$APP_DIR/.db-password"
            if [ ! -s "$DB_PASSWORD_FILE" ]; then
              openssl rand -hex 32 > "$DB_PASSWORD_FILE"
              chmod 600 "$DB_PASSWORD_FILE"
            fi
            export POSTGRES_PASSWORD="$(cat "$DB_PASSWORD_FILE")"
            export APP_IMAGE="$IMAGE"

            PREVIOUS_IMAGE="$(docker compose ps -q app 2>/dev/null | xargs -r docker inspect --format '{{.Config.Image}}' 2>/dev/null || true)"

            cat > docker-compose.yml <<'COMPOSE'
            services:
              app:
                image: ${APP_IMAGE}
                restart: unless-stopped
                environment:
                  DATABASE_URL: postgres://xian:${POSTGRES_PASSWORD}@postgres:5432/xian
                  APP_ORIGIN: ${APP_ORIGIN}
                  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
                  ASSET_STORAGE_ROOT: /app/data/assets
                ports:
                  - "${APP_PORT}:8080"
                volumes:
                  - xian-assets:/app/data/assets
                depends_on:
                  postgres:
                    condition: service_healthy
              postgres:
                image: postgres:17-alpine
                restart: unless-stopped
                environment:
                  POSTGRES_DB: xian
                  POSTGRES_USER: xian
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - xian-data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U xian"]
                  interval: 3s
                  timeout: 3s
                  retries: 10
              backup:
                image: postgres:17-alpine
                restart: unless-stopped
                environment:
                  PGPASSWORD: ${POSTGRES_PASSWORD}
                  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
                  BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
                volumes:
                  - xian-assets:/data/assets:ro
                  - xian-backups:/backups
                depends_on:
                  postgres:
                    condition: service_healthy
                entrypoint: ["/bin/sh", "-c"]
                command:
                  - |
                    while true; do
                      stamp=$$(date -u +%Y%m%dT%H%M%SZ)
                      pg_dump -h postgres -U xian -d xian -Fc > "/backups/db-$${stamp}.dump" &&
                      tar -czf "/backups/assets-$${stamp}.tar.gz" -C /data/assets .
                      find /backups -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete
                      sleep "$${BACKUP_INTERVAL_SECONDS}"
                    done
            volumes:
              xian-data:
              xian-assets:
              xian-backups:
            COMPOSE

            docker pull "$IMAGE"
            docker compose up -d postgres
            for i in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -U xian -d xian >/dev/null 2>&1; then break; fi
              if [ "$i" -eq 30 ]; then docker compose logs postgres --tail=100; exit 1; fi
              sleep 2
            done
            docker compose exec -T postgres psql -U xian -d xian -v ON_ERROR_STOP=1 -c "ALTER USER xian PASSWORD '$POSTGRES_PASSWORD'"
            docker compose run --rm --no-deps --entrypoint /bin/sh backup -c '
              stamp=$(date -u +%Y%m%dT%H%M%SZ)
              pg_dump -h postgres -U xian -d xian -Fc > "/backups/predeploy-${stamp}.dump" &&
              tar -czf "/backups/predeploy-assets-${stamp}.tar.gz" -C /data/assets .
            '
            docker compose up -d --remove-orphans

            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/api/v1/health/ready" >/dev/null 2>&1; then
                curl -fsS "http://127.0.0.1:${APP_PORT}/" >/dev/null
                echo "task-harbor healthy on port ${APP_PORT} after ${i}s"
                docker container prune --force >/dev/null
                docker image prune --all --force >/dev/null
                docker network prune --force >/dev/null
                docker builder prune --all --force --filter 'until=168h' >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 2
            done

            docker compose logs app --tail=100
            if [ -n "$PREVIOUS_IMAGE" ]; then
              echo "Health check failed; rolling back to $PREVIOUS_IMAGE"
              export APP_IMAGE="$PREVIOUS_IMAGE"
              docker compose up -d app
            fi
            exit 1
